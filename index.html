<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>E-Logbook Profesi Dokter UMT</title>

<meta name="theme-color" content="#006AB0">
<link rel="icon" type="image/svg+xml" href="logo-fk.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>:root{
  --bg:#F3F8FB;--surface:#FFFFFF;--surface-2:#E8F1F7;--line:#D3E1EB;--fg:#12303F;--mut:#4F687A;
  --brand:#006AB0;--brand-ink:#FFFFFF;--brand-soft:#DCEBF6;--accent:#ED1730;--teal:#42BFAE;
  --good:#12785A;--good-soft:#DAF2EA;--warn:#8F5F00;--warn-soft:#FAEBCB;--bad:#C0212F;--bad-soft:#FADDE0;--info:#1B73B3;--info-soft:#DCEDF8;
  --hero:#04365E;--hero-2:#006AB0;--hero-fg:#EAF4FB;--hero-mut:#A3C5DD;--hero-line:rgba(255,255,255,.16);--hero-acc:#57C3B7;
  --shadow:0 1px 2px rgba(4,40,70,.06),0 6px 18px rgba(4,40,70,.07);--r:14px;
  --f-head:'Bricolage Grotesque','IBM Plex Sans',system-ui,sans-serif;--f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08141D;--surface:#0F1F2B;--surface-2:#162B3A;--line:#254053;--fg:#E4EFF6;--mut:#95ADBD;
  --brand:#4FAAE3;--brand-ink:#04202F;--brand-soft:#123550;--accent:#FF5A6B;--teal:#57C3B7;
  --good:#5ED3B3;--good-soft:#103629;--warn:#EDB550;--warn-soft:#3A2B0D;--bad:#FF8C95;--bad-soft:#43181D;--info:#7DB9EE;--info-soft:#14304B;
  --hero:#062743;--hero-2:#0A5A94;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08141D;--surface:#0F1F2B;--surface-2:#162B3A;--line:#254053;--fg:#E4EFF6;--mut:#95ADBD;
  --brand:#4FAAE3;--brand-ink:#04202F;--brand-soft:#123550;--accent:#FF5A6B;--teal:#57C3B7;
  --good:#5ED3B3;--good-soft:#103629;--warn:#EDB550;--warn-soft:#3A2B0D;--bad:#FF8C95;--bad-soft:#43181D;--info:#7DB9EE;--info-soft:#14304B;
  --hero:#062743;--hero-2:#0A5A94;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
body.noscroll{overflow:hidden}
h1,h2,h3{font-family:var(--f-head);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.55rem,2.6vw,2rem)}h2{font-size:clamp(1.6rem,3.2vw,2.3rem)}h3{font-size:1.05rem}
p{margin:0}button{font:inherit;color:inherit;cursor:pointer}
code{font-family:var(--f-mono);font-size:.88em;background:var(--surface-2);padding:1px 6px;border-radius:6px}
.mono{font-family:var(--f-mono);font-size:.88em}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:.7rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.sub{color:var(--mut);max-width:68ch}.sub.max{max-width:62ch}.hint{font-size:.8rem;color:var(--mut)}.hint.c,.c{text-align:center}
.mut{color:var(--mut);font-size:.8rem}.nw{white-space:nowrap}.grow{flex:1;min-width:0}.mt{margin-top:18px}.big{font-size:1.4rem}
.wrapc{min-width:200px;max-width:380px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.between{justify-content:space-between;margin-bottom:12px}
.warnt{color:var(--warn);font-weight:600}.up{color:var(--good);font-weight:600}
.ic{flex:none}
/* tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:500;font-size:.9rem;text-decoration:none;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{border-color:var(--brand);background:var(--surface-2)}.btn:active{transform:translateY(1px)}
.btn:focus-visible,.lnk:focus-visible,.sn:focus-visible,.icon-btn:focus-visible,.chipf:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.demo-row:focus-visible,.tabs button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}.btn.primary:hover{filter:brightness(1.08);background:var(--brand)}
.btn.ghost{border-color:transparent;background:transparent}.btn.outline{background:transparent;border-color:currentColor}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}.btn.danger:hover{background:var(--bad-soft)}
.btn.lg{min-height:48px;padding:10px 22px;font-size:1rem}.btn.sm{min-height:32px;padding:4px 12px;font-size:.8rem;border-radius:8px}.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.lnk{background:none;border:0;padding:0;color:var(--brand);font-weight:500;text-decoration:underline;text-underline-offset:3px;text-align:left}
.back{display:inline-block;margin-bottom:10px;text-decoration:none}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.icon-btn:hover{border-color:var(--brand)}
/* pil dan bar */
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.74rem;font-weight:600;background:var(--surface-2);color:var(--mut);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--info-soft);color:var(--info)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px;min-width:60px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--brand)}.bar i.good{background:var(--good)}.bar i.warn{background:var(--accent)}
/* kartu */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px 0}
.card-b{padding:16px 18px 18px;min-width:0}.card-h+.card-b{padding-top:12px}
.card-r{display:flex;gap:8px;align-items:center}
.g2,.g3,.g4{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2.tight{gap:10px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:4px}.kpi-v{font-family:var(--f-head);font-size:2rem;font-weight:700;line-height:1.1}.kpi-v b{font-weight:700}.kpi-s{font-size:.8rem;color:var(--mut)}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}.phead-r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{text-align:center;padding:28px 12px;color:var(--mut)}.empty-t{font-weight:600;color:var(--fg)}.empty-s{font-size:.85rem;margin-top:2px}
/* tabel */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.card .tbl-wrap{border:0;border-radius:0}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{text-align:left;font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);font-weight:600;padding:10px 14px;background:var(--surface-2);white-space:nowrap}
.tbl td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
.tbl tr.hl td{background:var(--brand-soft)}.tgc{min-width:120px}.gcell{min-width:200px}
.tbl.edit input{width:90px;min-height:34px;padding:4px 8px}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line);font-size:.82rem;color:var(--mut)}.pager div{display:flex;gap:6px}
/* form */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;min-width:0}.field label{font-size:.82rem;font-weight:600}
input,select,textarea{width:100%;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:40px}
textarea{resize:vertical;line-height:1.45}input[type=checkbox]{width:auto;min-height:0}
input::placeholder,textarea::placeholder{color:var(--mut);opacity:.75}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:14px}.form-grid.inner{padding:0}.span2{grid-column:1/-1}
.form-act{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.checks{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}.chk{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.alert{padding:10px 14px;border-radius:10px;margin:12px 0;font-size:.88rem;background:var(--info-soft);color:var(--info)}.alert.bad{background:var(--bad-soft);color:var(--bad)}.alert.good{background:var(--good-soft);color:var(--good)}.alert.warn{background:var(--warn-soft);color:var(--warn)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar select{width:auto;min-width:170px}
.srch{position:relative;flex:1;min-width:200px}.srch .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut)}.srch input{padding-left:38px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chipf{padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:.84rem}.chipf.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}.chipf b{margin-left:4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:500;color:var(--mut);white-space:nowrap;margin-bottom:-1px}.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}.tabs button b{font-weight:600;background:var(--surface-2);border-radius:99px;padding:0 8px;font-size:.75rem;margin-left:4px}.tabs.sm button{padding:7px 12px}
/* modal dan toast */
#modal .mback{position:fixed;inset:0;z-index:100;background:rgba(3,18,17,.55);display:grid;place-items:center;padding:16px;overflow-y:auto}
.modal{background:var(--surface);color:var(--fg);border-radius:16px;width:min(520px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.35)}.modal.wide{width:min(760px,100%)}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}.mbody{padding:18px 20px 20px;overflow-y:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:120;background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:.88rem;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:calc(100vw - 32px)}.toast.good{background:var(--good);color:#fff}.toast.bad{background:var(--bad);color:#fff}.toast.warn{background:var(--warn);color:#fff}
/* detail kasus */
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;color:var(--mut);font-size:.85rem}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;margin:0 0 14px}.dl div{min-width:0}.dl dt{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}.dl dd{margin:0}
.box{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;background:var(--surface-2)}.box-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.bgbox{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.bgbox span{display:block}
.box.fb{background:var(--good-soft);border-color:transparent}.box.fb.bad{background:var(--bad-soft)}.pre{white-space:pre-wrap;margin-top:4px}
.consent{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}.qr{background:#fff;padding:8px;border-radius:10px;border:1px solid var(--line);width:136px;height:136px;display:grid;place-items:center}.qr svg{width:100%;height:100%}.qr-off{font-size:.72rem;color:#444;text-align:center}
.url{display:block;word-break:break-all;margin:6px 0}
/* dasbor mahasiswa */
.ep{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;margin-top:8px}
.tg{margin-bottom:14px}.tg>div:first-child{display:flex;justify-content:space-between;font-size:.88rem}
.pend{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.pend:first-child{border-top:0;padding-top:0}.pend>div:nth-child(2){flex:1;min-width:0}.pend span{display:block;font-size:.8rem;color:var(--mut)}
.pend-i{width:34px;height:34px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.fbi{padding:10px 0;border-top:1px solid var(--line)}.fbi:first-child{border-top:0;padding-top:0}.fbi p{font-size:.88rem;margin-top:4px}.fbi-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.78rem;color:var(--mut);margin-bottom:4px}
.rad-s{max-width:320px;margin:0 auto}
.evr{display:flex;gap:12px;padding:8px 0;align-items:center}.evr-d{width:48px;text-align:center;background:var(--brand-soft);color:var(--brand);border-radius:10px;padding:4px 0;flex:none}.evr-d b{display:block;font-family:var(--f-head);font-size:1.2rem}.evr-d span{font-size:.7rem;text-transform:uppercase}.evr span{display:block;font-size:.8rem;color:var(--mut)}
.feed{display:grid;gap:12px}.fb-ref{font-weight:600;margin-bottom:4px}.fbc textarea{margin-bottom:8px}
.asm-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}.asm-h span{display:block}.narr p{font-size:.85rem;margin-top:6px}
.shortc{text-align:left;padding:18px;display:flex;flex-direction:column;gap:6px;color:var(--fg)}.shortc:hover{border-color:var(--brand)}.shortc span{color:var(--mut);font-size:.85rem}
.ewn{padding:12px 0;border-top:1px solid var(--line)}.ewn:first-child{border-top:0;padding-top:0}.ewn p{margin:4px 0 8px;font-size:.88rem}.rek{background:var(--info-soft);color:var(--info);padding:8px 10px;border-radius:8px;margin-bottom:8px;font-size:.84rem}.rek b{display:block}
/* gantt dan legend */
.gantt{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}.gt{min-width:54px;padding:10px 6px;border-radius:10px;background:var(--surface-2);text-align:center;font-size:.8rem;font-weight:600}.gt small{display:block;font-weight:400;color:var(--mut);font-size:.68rem}
.gt.selesai{background:var(--good-soft);color:var(--good)}.gt.berjalan{background:var(--brand);color:var(--brand-ink)}.gt.berjalan small{color:inherit;opacity:.8}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:.78rem;color:var(--mut)}.legend span{display:inline-flex;gap:6px;align-items:center}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--surface-2)}.sw.d{background:var(--good-soft);border:1px solid var(--good)}.sw.n{background:var(--brand)}.sw.f{background:var(--surface-2);border:1px solid var(--line)}.sw.lo{background:var(--bad-soft)}.sw.mid{background:var(--warn-soft)}.sw.hi{background:var(--good-soft)}.sw.s0{background:var(--brand)}.sw.s1{background:var(--accent)}
/* grafik */
.chart{width:100%;height:auto;display:block}.chart.wide{max-height:260px}
.ch-grid{stroke:var(--line);fill:none;stroke-width:1}.ch-area{fill:var(--brand);fill-opacity:.22;stroke:var(--brand);stroke-width:2}.ch-dot{fill:var(--brand)}.ch-txt{fill:var(--mut);font-size:10.5px;font-family:var(--f-body)}
.ch-fill{fill:var(--brand);fill-opacity:.12}.ch-line{fill:none;stroke:var(--brand);stroke-width:2.4;stroke-linejoin:round}.ch-line.s1{stroke:var(--accent)}.ch-pt{fill:var(--surface);stroke:var(--brand);stroke-width:2}.ch-pt.s1{stroke:var(--accent)}.ch-lbl{fill:var(--fg);font-size:11px;font-weight:600}
.hbars{display:grid;gap:10px}.hb{display:grid;grid-template-columns:minmax(90px,38%) 1fr 54px;gap:10px;align-items:center;font-size:.84rem}.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb-t{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}.hb-t i{display:block;height:100%;background:var(--brand);border-radius:99px}.hb-t i.good{background:var(--good)}.hb-t i.warn{background:var(--accent)}.hb-t i.bad{background:var(--bad)}.hb-v{text-align:right;font-weight:600}
.hbars.sm .hb{grid-template-columns:minmax(80px,42%) 1fr 24px;font-size:.78rem}
.cols{display:flex;gap:6px;align-items:flex-end;height:190px;overflow-x:auto;padding-top:6px}.col{flex:1;min-width:34px;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}.col-b{flex:1;width:100%;display:flex;align-items:flex-end;background:var(--surface-2);border-radius:6px;overflow:hidden}.col-b i{display:block;width:100%;background:var(--brand);border-radius:6px 6px 0 0}.col-v{font-size:.74rem;font-weight:600}.col-l{font-size:.66rem;color:var(--mut);text-align:center;line-height:1.1;word-break:break-word}
.gauge{padding:6px 0 2px}.gauge-t{position:relative;height:10px;border-radius:99px;background:linear-gradient(90deg,var(--bad-soft),var(--warn-soft) 40%,var(--good-soft))}.gauge-t i{position:absolute;top:-4px;width:6px;height:18px;margin-left:-3px;border-radius:3px;background:var(--brand)}.gauge-s{display:flex;justify-content:space-between;font-size:.66rem;color:var(--mut);margin-top:3px}.gauge-l{font-size:.78rem;color:var(--mut);margin-top:2px}
.pc{margin-bottom:16px}.pc-h{display:flex;justify-content:space-between;font-size:.88rem;margin-bottom:4px}
.epa-l{display:grid;gap:10px}.epa-i{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.epa-i:first-child{border-top:0}.epa-t b{display:block;font-size:.88rem}.epa-t span{font-size:.76rem;color:var(--mut)}
.steps{display:flex;gap:4px;align-items:center;flex:none}.steps i{width:14px;height:14px;border-radius:4px;background:var(--surface-2)}.steps i.on{background:var(--brand)}.steps b{font-size:.78rem;margin-left:6px}
.lv{margin:0;padding-left:18px;display:grid;gap:6px;font-size:.88rem}
.mosaic{width:100%;border-collapse:separate;border-spacing:3px;font-size:.8rem}.mosaic th{text-align:left;font-weight:600;padding:4px 6px;white-space:nowrap}.mosaic thead th{text-align:center;color:var(--mut);font-size:.7rem}.mosaic td{text-align:center;padding:0}
.mz{display:block;min-width:38px;padding:6px 4px;border-radius:6px;background:var(--surface-2);font-weight:600}.mz.na{background:var(--surface-2);color:var(--mut)}.mz.lo{background:var(--bad-soft);color:var(--bad)}.mz.mid{background:var(--warn-soft);color:var(--warn)}.mz.hi{background:var(--good-soft);color:var(--good)}
.heatm .lnk{text-decoration:none;font-weight:600}.sumrow th,.sumrow td{border-top:2px solid var(--line)}
/* gerbang masuk */
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}.brand b{display:block;font-family:var(--f-head);font-size:1.05rem}.brand small{display:block;font-size:.7rem;color:var(--mut)}
.logos{display:flex;gap:10px;align-items:center}
.logo-chip{display:grid;place-items:center;background:#fff;border-radius:14px;padding:8px;box-shadow:0 1px 3px rgba(0,0,0,.14)}.logo-chip img{display:block;height:64px;width:auto;max-width:100%}
.gate{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);min-height:100vh}
.gate-brand{position:relative;background:linear-gradient(155deg,var(--hero) 0%,#04507F 55%,var(--hero-2) 100%);color:var(--hero-fg);display:flex;flex-direction:column;justify-content:space-between;gap:32px;padding:clamp(24px,4vw,48px) max(clamp(20px,4vw,56px),env(safe-area-inset-left,0px));padding-top:max(clamp(24px,4vw,48px),calc(env(safe-area-inset-top,0px) + 16px));overflow:hidden}
.gate-brand::after{content:"";position:absolute;right:-90px;bottom:-90px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(87,195,183,.28),transparent 68%);pointer-events:none}
.gate-top .logo-chip img{height:76px}
.gate-title h1{font-size:clamp(2.2rem,4.6vw,3.4rem);letter-spacing:-.02em}.gate-p{margin-top:8px;font-size:1.2rem;font-weight:500}.gate-sub{margin-top:4px;color:var(--hero-mut)}
.gate-foot{font-size:.8rem;color:var(--hero-mut)}.gate-foot b{display:block;color:var(--hero-fg);font-weight:600;margin-top:2px}
.gate-form{position:relative;display:grid;place-items:center;padding:clamp(24px,4vw,48px) max(20px,env(safe-area-inset-right,0px));background:var(--bg)}
.gate-theme{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px))}
.gate-card{width:min(420px,100%)}.gate-card h2{font-size:1.7rem;margin-bottom:6px}.gate-card form{margin-top:18px}.gate-card .hint{margin-top:14px}
.demo-flag{margin-top:6px}.demo-box{margin-top:22px;padding-top:16px;border-top:1px dashed var(--line)}.demo-box .eyebrow{display:block;margin-bottom:10px}
.demo-list{display:grid;gap:8px}.demo-row{display:flex;gap:12px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;width:100%}.demo-row:hover{border-color:var(--brand);background:var(--brand-soft)}.dr-t{flex:1;min-width:0}.dr-t b{display:block;font-size:.88rem}.dr-t small{color:var(--mut)}
.av{width:34px;height:34px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;flex:none}
/* umum tambahan */
.ticks{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}.ticks li{position:relative;padding-left:24px;font-size:.9rem}.ticks li::before{content:"";position:absolute;left:0;top:.35em;width:12px;height:7px;border-left:2px solid var(--brand);border-bottom:2px solid var(--brand);transform:rotate(-45deg)}.ticks.big li{font-size:1rem}
.who-i{width:40px;height:40px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
/* shell */
.shell{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.side{background:var(--hero);color:var(--hero-fg);position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;padding:18px 12px;gap:6px;overflow-y:auto}
.side-top{padding:2px 4px 8px}.side-top .brand{display:grid;gap:10px;width:100%}.side-top .logos{display:grid;grid-template-columns:1fr 1fr;gap:8px}.side-top .logo-chip{padding:6px}.side-top .logo-chip img{height:54px;width:100%;object-fit:contain}.brand-t{display:block}.brand.inv b{color:var(--hero-fg)}.brand.inv small{color:var(--hero-mut)}
.role-badge{margin:4px 6px 10px;padding:10px 12px;border-radius:12px;background:rgba(94,216,204,.12);border:1px solid var(--hero-line)}.role-badge .eyebrow{color:var(--hero-mut);display:block}.role-badge b{font-family:var(--f-head)}
.snav{display:grid;gap:2px}.sn{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:10px;border:0;background:none;color:var(--hero-mut);text-align:left;font-size:.9rem}.sn:hover{background:rgba(255,255,255,.07);color:var(--hero-fg)}.sn.on{background:var(--hero-acc);color:var(--hero);font-weight:600}
.side-foot{margin-top:auto;display:grid;gap:8px;padding-top:12px;border-top:1px solid var(--hero-line)}.site-note{display:flex;gap:8px;font-size:.72rem;color:var(--hero-mut);padding:0 6px}
.usercard{display:flex;gap:10px;align-items:center;padding:6px}.usercard .av{background:var(--hero-acc);color:var(--hero)}.uc-t{min-width:0}.uc-t b{display:block;font-size:.84rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.uc-t small{display:block;font-size:.72rem;color:var(--hero-mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scrim{display:none}
.main{min-width:0}.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}.top-in{display:flex;align-items:center;gap:12px;min-height:60px}.top-t{display:flex;flex-direction:column;line-height:1.2;flex:1;min-width:0}.top-t b{font-family:var(--f-head);font-size:1.05rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.top-r{display:flex;gap:8px;align-items:center}.menu-btn{display:none}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px}.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:.8rem;font-weight:500;color:var(--mut)}.seg button.on{background:var(--brand);color:var(--brand-ink)}
.chip-priv{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:99px;background:var(--good-soft);color:var(--good);font-size:.74rem;font-weight:600;white-space:nowrap}
.content{padding-block:24px 56px;max-width:1280px}
/* responsif */
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.pnav-in{justify-content:space-between}.chip-priv{display:none}}
@media (max-width:900px){
  .gate{grid-template-columns:1fr;min-height:100vh}.gate-brand{gap:22px;padding-bottom:28px}.gate-top .logo-chip img{height:60px}.gate-form{align-items:start}
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;height:auto;width:min(290px,86vw);z-index:90;transform:translateX(-102%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top,0px))}.side.open{transform:none}
  .scrim.on{display:block;position:fixed;inset:0;z-index:80;background:rgba(3,18,17,.5)}.menu-btn{display:inline-grid}
  .g2{grid-template-columns:1fr}
}
@media (max-width:600px){
  .g3{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi{padding:12px 14px}
  .form-grid,.dl{grid-template-columns:1fr}
  .hb{grid-template-columns:minmax(70px,40%) 1fr 44px}.seg button{padding:6px 8px}.kpi-v{font-size:1.6rem}
  .brand small{display:none}.top-in{gap:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.busy{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:3px;z-index:120;background:linear-gradient(90deg,transparent,var(--brand),var(--teal),transparent);background-size:50% 100%;background-repeat:no-repeat;animation:busy 1s linear infinite}
@keyframes busy{from{background-position:-50% 0}to{background-position:150% 0}}
[hidden]{display:none!important}

/* Pemetaan kompetensi SKDI */
const AREA_SHORT = ['Profesionalitas', 'Mawas diri', 'Komunikasi', 'Info', 'Landasan ilmiah', 'Keterampilan klinis', 'Masalah kesehatan'];
const AREA_SRC = ['Mini-CEX dan DOPS domain profesionalisme, MSF', 'Persentase entri logbook yang disertai refleksi, terhadap target 30 persen', 'Mini-CEX komunikasi, DOPS informed consent, EPA Edukasi dan komunikasi', 'EPA Dokumentasi rekam medis, kelengkapan dan validasi logbook', 'CBT dan CBD', 'Mini-CEX anamnesis dan pemeriksaan fisik, DOPS teknik, OSCE', 'Mini-CEX penalaran klinis, EPA Tata laksana, EPA Rujukan'];
function areaScores(sids) {
  const a = sids.reduce((t, id) => t.concat(asmsOf(id).filter(x => x.stat === 'dinilai')), []);
  const mc = a.filter(x => x.jenis === 'Mini-CEX'), dp = a.filter(x => x.jenis === 'DOPS');
  const avg = (l, i) => l.length ? mean(l.map(x => x.sk[i])) / 9 * 100 : null;
  const nv = k => { const v = S.nilai.filter(n => sids.includes(n.sid) && n.komp === k && n.tahap === 'PSPD').map(n => n.v); return v.length ? mean(v) : null; };
  const epa = i => { const v = sids.map(id => (S.epa[id] || [])[i]).filter(x => x != null); return v.length ? mean(v) / 5 * 100 : null; };
  const cs = sids.reduce((t, id) => t.concat(casesOf(id).filter(c => c.jenis === 'Kasus')), []);
  const valR = cs.length ? cs.filter(c => c.stat === 'valid').length / cs.length * 100 : null;
  const refR = cs.length ? Math.min(100, cs.filter(c => c.ref).length / cs.length / .3 * 100) : null;
  const m = function () { const v = Array.prototype.slice.call(arguments).filter(y => y != null); return v.length ? mean(v) : null; };
  return [m(avg(mc, 2), avg(dp, 5), nv('MSF')), refR, m(avg(mc, 4), avg(dp, 1), epa(5)), m(epa(6), valR), m(nv('CBT'), nv('CBD')), m(avg(mc, 0), avg(mc, 1), avg(dp, 2), nv('OSCE')), m(avg(mc, 3), epa(4), epa(8))];
}

function impUnit(tahap, raw) {
  const t = String(raw || '').trim().toLowerCase(); if (!t) return null;
  if (tahap === 'PSSK') { const b = PSSK_BLOK.find(x => x.toLowerCase() === t || x.toLowerCase().replace('blok ', '') === t); return b || null; }
  const s = S.stases.find(x => x.id === t || x.pendek.toLowerCase() === t || x.nama.toLowerCase() === t); return s ? s.id : null;
}
function impValidate() {
  const I = UI.imp; if (!I) return [];
  return I.rows.map((r, i) => {
    const g = k => I.map[k] >= 0 ? String(r[I.map[k]] == null ? '' : r[I.map[k]]).trim() : '';
    const err = []; const st = S.students.find(s => s.nim.toLowerCase() === g('nim').toLowerCase()); if (!st) err.push('NIM tidak ditemukan');
    let tahap = g('tahap').toUpperCase() || 'PSPD'; if (tahap !== 'PSSK' && tahap !== 'PSPD') { err.push('Tahap harus PSSK atau PSPD'); tahap = 'PSPD'; }
    const unit = impUnit(tahap, g('unit')); if (!unit) err.push('Stase atau blok tidak dikenali');
    const allowed = tahap === 'PSSK' ? Object.keys(S.bobotBlok) : ['CBT', 'OSCE', 'CBD', 'MSF'];
    const komp = allowed.find(k => k.toLowerCase() === g('komp').toLowerCase()); if (!komp) err.push('Komponen tidak valid untuk ' + tahap);
    const v = parseFloat(g('v').replace(',', '.')); if (isNaN(v) || v < 0 || v > 100) err.push('Nilai harus 0 sampai 100');

}

FORMS.pw = async f => {

  if (n.length < 8) { toast(ERR.weak, 'bad'); return; }
  if (n !== n2) { toast('Pengulangan kata sandi tidak sama', 'bad'); return; }
  if (n === o) { toast('Kata sandi baru harus berbeda dari yang lama', 'bad'); return; }
  if (SERVER) {
    const r = await api('chpw', { old: o, nw: n });
    if (!r || !r.ok) { toast(errText(r), 'bad'); return; }
    setToken(r.token); if (S.me) S.me.must = false; closeModal(true); render(); toast('Kata sandi diperbarui'); return;
  }
  const u = me(); if (u.pw !== o) { toast('Kata sandi saat ini tidak cocok', 'bad'); return; }

};

const Admin = {
  async call(op, data) { const r = await api('admin', Object.assign({ op }, data)); if (!r || !r.ok) { toast(errText(r), 'bad'); return null; } return r; },
  local: {
    create(d, pw, hash) {
      if (!d.nama || !/^\S+@\S+$/.test(d.email) || S.users.some(u => u.email.toLowerCase() === d.email)) return null;
      const u = { id: genId('u'), nama: d.nama, email: d.email, roles: d.roles, pw, unit: d.unit || '', sid: null, demo: false, aktif: true };
      if (d.roles.indexOf('mahasiswa') >= 0) u.sid = addStudent(d.nama, d.nim, d.g, d.angk, d.mulai);
      S.users.push(u); return u;
    }
  },
  async userSave(id, d) {
    if (SERVER) { const r = await Admin.call(id ? 'userUpdate' : 'userCreate', Object.assign({ id }, d)); if (!r) return null; await reload(true); return r; }
    if (!id) { const pw = tempPw(); const u = Admin.local.create(d, pw); if (!u) { toast('Nama atau email tidak valid, atau email sudah terdaftar', 'bad'); return null; } save(); return { ok: true, pw }; }
    const u = userById(id); if (!u) return null;
    if (u.id === S.session.uid && (d.aktif === false || d.roles.indexOf('admin') < 0)) { toast('Anda tidak dapat menonaktifkan akun sendiri atau melepas peran admin Anda', 'bad'); return null; }
    Object.assign(u, { nama: d.nama, roles: d.roles, unit: d.unit, aktif: d.aktif !== false });
    if (d.roles.indexOf('mahasiswa') >= 0) { if (!u.sid) u.sid = addStudent(d.nama, d.nim, d.g, d.angk, d.mulai); else { const st = studentById(u.sid); Object.assign(st, { nama: d.nama, g: d.g, angk: d.angk, mulai: d.mulai }); if (d.nim) st.nim = d.nim; } }
    save(); return { ok: true };
  },
  async userReset(id) {
    if (SERVER) return Admin.call('userReset', { id });
    const u = userById(id); if (!u) return null; u.pw = tempPw(); save(); return { ok: true, pw: u.pw };
  }
};

FORMS.regok = async f => {
  const r = S.regs.find(x => x.id === f.dataset.id); const rs = checked(f); if (!r) return closeModal();
  if (!rs.length) { toast('Pilih minimal satu peran', 'bad'); return; }
  const d = { roles: rs, nim: F(f, 'uf-nim').trim(), g: parseInt(F(f, 'uf-g'), 10) || 0, angk: F(f, 'uf-angk').trim(), mulai: F(f, 'uf-mulai') };
  if (SERVER) { const x = await Admin.call('regApprove', Object.assign({ id: r.id }, d)); if (!x) return; await reload(true); closeModal(true); render(); toast('Akun ' + r.nama + ' aktif'); return; }
  const u = { id: genId('u'), nama: r.nama, email: r.email, roles: rs, pw: r.pw, unit: r.unit || '', sid: null, demo: false, aktif: true };
  if (rs.indexOf('mahasiswa') >= 0) u.sid = addStudent(r.nama, d.nim || r.unit, d.g, d.angk, d.mulai);
  S.users.push(u); S.regs = S.regs.filter(x => x.id !== r.id); done('Akun ' + r.nama + ' aktif');
};
A['reg-no'] = async el => {
  if (SERVER) { const x = await Admin.call('regReject', { id: el.dataset.id }); if (!x) return; await reload(true); toast('Pendaftaran ditolak'); return; }
  S.regs = S.regs.filter(x => x.id !== el.dataset.id); save(); render(); toast('Pendaftaran ditolak');
};
A['user-tpl'] = () => copyText('nama,email,peran,nim,kelompok,mulai,angkatan\nDr. Contoh,contoh@umt.ac.id,dosen|preseptor,,,,\nBudi Santoso,budi@umt.ac.id,mahasiswa,PD25101,A,' + iso(T0) + ',' + T0.getFullYear(), 'Templat disalin');
FORMS.userimp = async f => {
  const txt = F(f, 'ui-t'); UI.userCsv = txt; let rows = parseCSV(txt); if (!rows.length) { toast('CSV kosong', 'bad'); return; }
  if (/nama/i.test(rows[0][0] || '')) rows = rows.slice(1);
  const recs = rows.map(r => ({ nama: (r[0] || '').trim(), email: (r[1] || '').trim().toLowerCase(), roles: (r[2] || '').split(/[|+]/).map(x => x.trim().toLowerCase()).filter(x => ROLES_ALL.indexOf(x) >= 0), nim: (r[3] || '').trim(), g: kelFrom(r[4]), mulai: /^\d{4}-\d{2}-\d{2}$/.test((r[5] || '').trim()) ? r[5].trim() : '', angk: (r[6] || '').trim() || String(T0.getFullYear()) }));
  let made = [], skip = [];
  if (SERVER) { const x = await Admin.call('userImport', { rows: recs }); if (!x) return; made = x.made; skip = x.skip; await reload(true); }
  else recs.forEach((d, i) => { const pw = tempPw(); const u = Admin.local.create(d, pw); if (u) made.push({ nama: d.nama, email: d.email, pw }); else skip.push({ i: i + 1, email: d.email, err: 'tidak valid atau sudah ada' }); });
  UI.userCsv = ''; if (!SERVER) save(); render(); showCreds(made, made.length + ' akun dibuat', skip);
};
A['ev-new'] = () => eventForm();
FORMS.event = f => { S.events.push({ id: genId('ev'), jenis: F(f, 'ev-j'), judul: F(f, 'ev-t').trim(), st: F(f, 'ev-s'), tgl: F(f, 'ev-d'), lokasi: F(f, 'ev-l').trim(), penguji: F(f, 'ev-p'), kuota: parseInt(F(f, 'ev-k'), 10) || 1, status: 'Dijadwalkan' }); done('Event dijadwalkan'); };
A['ev-st'] = el => { const e = S.events.find(x => x.id === el.dataset.id); if (e) { e.status = el.dataset.v; save(); render(); toast('Status event diperbarui'); } };
FORMS.stase = f => {
  S.stases.forEach(s => { s.minggu = clamp(parseInt(F(f, 'st-m-' + s.id), 10) || s.minggu, 1, 20); s.tf = Math.max(0, parseInt(F(f, 'st-f-' + s.id), 10) || 0); s.tr = Math.max(0, parseInt(F(f, 'st-r-' + s.id), 10) || 0); });
  save(); render(); toast('Kurikulum stase tersimpan');
};
FORMS.bobot = f => {
  const isS = f.dataset.t === 'stase'; const B = isS ? S.bobotStase : S.bobotBlok; const pre = isS ? 'bs-' : 'bb-'; const nb = {}; let sum = 0;
  Object.keys(B).forEach(k => { nb[k] = Math.max(0, parseFloat(F(f, pre + k)) || 0); sum += nb[k]; });
  if (Math.round(sum) !== 100) { toast('Total bobot harus 100, saat ini ' + Math.round(sum), 'bad'); return; }
  if (isS) S.bobotStase = nb; else S.bobotBlok = nb; save(); render(); toast('Bobot nilai tersimpan');
};
A['wah-new'] = () => wahForm();
FORMS.wahana = f => { S.wahana.push({ id: genId('w'), nama: F(f, 'wh-n').trim(), jenis: F(f, 'wh-j') }); done('Wahana ditambahkan'); };

/* impor hasil asesmen */
FORMS.impparse = f => {
  const txt = F(f, 'imp-text'); UI.impText = txt; const rows = parseCSV(txt);
  if (rows.length < 2) { toast('CSV perlu baris judul dan minimal satu baris data', 'bad'); return; }
  UI.imp = { head: rows[0], rows: rows.slice(1), map: impAutoMap(rows[0]) }; render();
};
CH['imp-map'] = el => { UI.imp.map[el.dataset.k] = parseInt(el.value, 10); render(); };
CH['imp-file'] = el => {
  const file = el.files && el.files[0]; if (!file) return; const rd = new FileReader();
  rd.onload = () => { const txt = String(rd.result || ''); UI.impText = txt; const rows = parseCSV(txt); if (rows.length < 2) { toast('Berkas tidak berisi data', 'bad'); render(); return; } UI.imp = { head: rows[0], rows: rows.slice(1), map: impAutoMap(rows[0]) }; render(); };
  rd.onerror = () => toast('Berkas tidak dapat dibaca', 'bad'); rd.readAsText(file);
};
A['imp-reset'] = () => { UI.imp = null; render(); };
A['imp-commit'] = () => {
  let ins = 0, upd = 0;
  impValidate().forEach(x => { if (!x.ok) return; const r = x.rec; const ex = S.nilai.find(n => n.sid === r.sid && n.tahap === r.tahap && n.unit === r.unit && n.komp === r.komp); if (ex) { Object.assign(ex, r); upd++; } else { S.nilai.push(r); ins++; } });
  UI.imp = null; UI.impText = ''; save(); render(); toast(ins + ' nilai baru, ' + upd + ' diperbarui');
};
A['imp-tpl'] = () => copyText('nim,tahap,stase,komponen,nilai,tanggal\nPD25001,PSPD,ipd,OSCE,78,2026-10-10\nPD25002,PSPD,anak,CBT,82,2026-09-20\nPD25003,PSSK,Blok Respirasi,CBT,74,2026-03-15', 'Templat CSV disalin');
A['audit-copy'] = () => copyText(toCSV([['Waktu', 'Pengguna', 'Entri', 'Alasan', 'Menit', 'Status']].concat(S.audit.map(a => { const c = S.cases.find(x => x.id === a.cid); return [a.ts, pname(a.uid), c ? c.dx : '-', a.alasan, a.menit, a.status]; }))), 'Catatan audit disalin');

/* ---------- Penghubung kejadian ---------- */
function setF(el) { const p = el.dataset.f.split('.'); if (!UI.fl[p[0]]) UI.fl[p[0]] = {}; UI.fl[p[0]][p[1]] = el.value; if (p[0] === 'log') UI.fl.log.page = 1; render(); }
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]'); if (!el) return; const fn = A[el.dataset.a]; if (!fn) return;
  if (el.tagName === 'A') ev.preventDefault(); fn(el, ev);
});
document.addEventListener('submit', ev => { const f = ev.target.closest('form[data-form]'); if (!f) return; ev.preventDefault(); const fn = FORMS[f.dataset.form]; if (fn) fn(f, ev.submitter); });
document.addEventListener('change', ev => { const el = ev.target; if (el.dataset && el.dataset.ch && CH[el.dataset.ch]) CH[el.dataset.ch](el); if (el.dataset && el.dataset.f && el.tagName === 'SELECT') setF(el); });
document.addEventListener('input', ev => { const el = ev.target; if (!el.dataset) return; if (el.dataset.f && el.tagName !== 'SELECT') setF(el); else if (el.dataset.ch === 'case-dx') CH['case-dx'](el); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') { const m = document.getElementById('modal'); if (m && !m.hidden) closeModal(); else if (UI.navOpen) { UI.navOpen = false; render(); } } });

/* ---------- Boot ---------- */
async function boot() {
  applyTheme();
  if (typeof window !== 'undefined') window.addEventListener('hashchange', () => { if (!S.session) render(); });
  if (!SERVER) {
    loadDemo();
    if (S.session) { const u = userById(S.session.uid); if (!u || !u.roles.length) S.session = null; else if (u.roles.indexOf(S.session.role) < 0) S.session.role = u.roles[0]; }
    UI.route = S.session ? NAV[S.session.role][0][0] : 'login'; render(); return;
  }
  S = emptyState(); UI.route = 'login';
  if (TOKEN) { UI.booting = true; render(); await startSession(); UI.booting = false; render(); } else render();
}
boot();
</script></body></html>
